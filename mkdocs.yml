site_name: SLOFFDE 学习笔记
site_url: https://sloffde.github.io/notes/
repo_url: https://github.com/sloffde/notes
repo_name: sloffde/notes
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber

plugins:
  - search:
      lang:
        - en
        - ja
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - footnotes
  - def_list

extra_css:
  - stylesheets/extra.css

nav:

  - 首页: index.md
  - 医学免责声明: disclaimer.md
  - 贡献指南: 贡献指南.md
